apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cipherchat-gitops
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: "backend=ijaymane/back-cipherchat,frontend=ijaymane/front-cipherchat"
    argocd-image-updater.argoproj.io/backend.update-strategy: latest
    argocd-image-updater.argoproj.io/frontend.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-repository: https://github.com/IJ-Aymane/cipherchat-gitops.git
spec:
  project: default
  source:
    repoURL: https://github.com/IJ-Aymane/cipherchat-gitops.git
    targetRevision: HEAD
    path: .
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
